---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: finpulse-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      initContainers:
        # MLflow exits if Postgres is not accepting connections yet, and with
        # no ordering it crashloops until backoff outlasts helm --wait.
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres 5432; do
                echo "waiting for postgres:5432"
                sleep 3
              done
      containers:
        - name: mlflow
          image: ghcr.io/mlflow/mlflow:v2.20.2
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 30
          env:
            - name: MLFLOW_TRACKING_URI
              value: http://0.0.0.0:8000
            - name: MLFLOW_S3_ENDPOINT_URL
              value: http://minio:9000
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: accesskey
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: secretkey
          command: ["/bin/sh", "-c"]
          args:
            - |
              pip install psycopg2-binary boto3 &&
              mlflow server --backend-store-uri postgresql://user:password@postgres/mlflowdb \
              --artifacts-destination s3://mlflow-artifacts/ --serve-artifacts --host 0.0.0.0 --port 8000
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: finpulse-platform
spec:
  type: {{ .Values.serviceType }}
  selector:
    app: mlflow
  ports:
    - port: 8000
      targetPort: 8000
      {{- if eq .Values.serviceType "NodePort" }}
      nodePort: {{ .Values.mlflow.nodePort }}
      {{- end }}
  {{- if eq .Values.serviceType "ClusterIP" }}
  externalIPs:
    - {{ .Values.mlflow.externalIP }}
  {{- end }}
