apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: train-model
spec:
  entrypoint: training-and-build
  arguments:
    parameters:
    - name: endpoint-ip

  templates:
  - name: training-and-build
    steps:
      - - name: trigger-training-endpoint
          template: call-endpoint
          arguments:
            parameters:
            - name: endpoint-ip
              value: "{{workflow.parameters.endpoint-ip}}"
      - - name: build-container
          template: trigger-build
          arguments:
            parameters:
            - name: model-version
              value: "{{steps.trigger-training-endpoint.outputs.result}}"
          when: "{{steps.trigger-training-endpoint.outputs.result}} != ''"

  - name: call-endpoint
    inputs:
      parameters:
      - name: endpoint-ip
    script:
      image: alpine:3.18
      command: [sh]
      source: |

        MAX_RETRIES=5
        RETRY_DELAY=3
        i=1
        INSTALL_SUCCESS=0

        set +e  # allow manual error handling

        # Retry installation
        while [ $i -le $MAX_RETRIES ]; do
          echo "[INFO] Attempt $i to install curl and jq..." >&2
          apk update > /dev/null 2>&1
          apk add --no-cache curl jq > /dev/null 2>&1
          STATUS=$?
          if [ $STATUS -eq 0 ]; then
            echo "[INFO] Packages installed successfully." >&2
            INSTALL_SUCCESS=1
            break
          fi
          echo "[WARN] apk add failed (exit $STATUS). Retrying in $RETRY_DELAY seconds..." >&2
          sleep $RETRY_DELAY
          i=$((i + 1))
        done

        set -e  # return to fail-fast mode

        if [ $INSTALL_SUCCESS -ne 1 ]; then
          echo "[ERROR] Failed to install curl and jq after $MAX_RETRIES attempts." >&2
          exit 1
        fi

        # Kick off training, then poll until it finishes. A single blocking
        # request would hold the connection for the whole run and time out;
        # the service starts a background run and reports progress on /status.
        ENDPOINT="http://{{inputs.parameters.endpoint-ip}}:9090"

        echo "[INFO] Triggering model training..." >&2
        curl -f -s -X POST "$ENDPOINT/trigger-training" >&2 || {
          echo "[ERROR] Could not reach $ENDPOINT/trigger-training" >&2; exit 1;
        }

        MAX_WAIT=${MAX_WAIT:-3600}
        WAITED=0
        while [ $WAITED -lt $MAX_WAIT ]; do
          STATUS=$(curl -f -s "$ENDPOINT/status" || echo '{}')
          RUNNING=$(echo "$STATUS" | jq -r '.running // false')
          if [ "$RUNNING" != "true" ]; then
            ERR=$(echo "$STATUS" | jq -r '.last_error // empty')
            if [ -n "$ERR" ]; then
              echo "[ERROR] Training failed: $ERR" >&2; exit 1
            fi
            VERSION=$(echo "$STATUS" | jq -r '.last_version // empty')
            break
          fi
          sleep 15
          WAITED=$((WAITED + 15))
          echo "[INFO] still training (${WAITED}s)..." >&2
        done

        if [ -z "$VERSION" ]; then
          echo "[ERROR] No model version after ${WAITED}s." >&2
          exit 1
        fi

        echo "[INFO] Registered model version: $VERSION" >&2
        echo -n "$VERSION"

  - name: trigger-build
    inputs:
      parameters:
      - name: model-version
    resource:
      action: create
      manifest: |
        apiVersion: argoproj.io/v1alpha1
        kind: Workflow
        metadata:
          generateName: build-container-image-
        spec:
          workflowTemplateRef:
            name: build-container-image
          arguments:
            parameters:
            - name: model-version
              value: "{{inputs.parameters.model-version}}"
