[defaults]
stdout_callback = yaml
inventory = inventory.yml
host_key_checking = False

# Nodes sit on a private subnet, reachable only through the floating-IP node.
# Set BASTION_HOST to that node's public address, e.g.
#   export BASTION_HOST=cc@129.114.26.118
# The previous version hardcoded both the inventory path (/work/...) and the
# bastion IP, so this config only worked inside one author's environment.
[ssh_connection]
ssh_args = -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ForwardAgent=yes -o ProxyCommand="ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -W %h:%p {{ lookup('env', 'BASTION_HOST') }}"
